<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>عراق هوب</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="cursor"></div>
  <nav>
    <div class="logo">🇮🇶 عراق هوب</div>
    <a href="#home">الرئيسية</a>
    <a href="#gallery">صور مال ماب</a>
    <a href="#dev">مطور الموقع</a>
    <div id="soundBtn" class="sound-btn">🔊</div>
  </nav>

  <div id="soundPanel" class="sound-panel">
    <div class="sound-header">الصوت</div>
    <button id="playAudioBtn" class="play-audio-btn">تشغيل الصوت</button>
    <div class="slider-container">
      <label>القوة</label>
      <input type="range" id="volumeSlider" min="0" max="100" value="25">
    </div>
    <div class="sound-controls">
      <button id="muteBtn">كتم</button>
      <button id="unmuteBtn">شيل لكتم</button>
      <button id="closePanel">سده</button>
    </div>
  </div>

  <section id="home" class="section">
    <div class="hero">
      <h1>عراق هوب</h1>
      <p>اول ماب عراقي يشك شك بروبلوكس</p>
      <div class="main-buttons">
        <a href="https://www.roblox.com/games/17668572730/unnamed" target="_blank" class="btn">اتونس هسه</a>
        <a href="https://discord.gg/v3r7fACX" target="_blank" class="btn discord-main">
          <span class="status-indicator online"></span> ادخل هنا شمنتضر
        </a>
      </div>
    </div>
  </section>

  <section id="gallery" class="section">
    <div class="gallery">
      <div class="img" style="background-image:url('workgranr/1.png')"></div>
      <div class="img" style="background-image:url('workgranr/image.png')"></div>
    </div>
  </section>

 <section id="dev" class="section">
  <div class="dev-card">
    <div class="avatar">👤</div>
    <h2>Kazem - الأسطورة بروسلي</h2>
    <div class="info-grid">
      <div class="info-item">
        <span class="label">الاسم:</span>
        <span class="value">Kazem</span>
      </div>
      <div class="info-item">
        <span class="label">اللقب:</span>
        <span class="value">الأسطورة بروسلي</span>
      </div>
      <div class="info-item">
        <span class="label">المواليد:</span>
        <span class="value">2007</span>
      </div>
      <div class="info-item">
        <span class="label">شغلي:</span>
        <span class="value">مبرمج HTML</span>
      </div>
      <div class="info-item">
        <span class="label">Discord:</span>
        <span class="value discord-id">gy9k</span>
      </div>
    </div>
    <div class="quote">كن قائداً فلتاريخ لايذكر الجنود</div>
  </div>
</section>

  <footer>© 2025 عراق هوب — صنع في بغداد</footer>

  <audio id="qasiida" loop>
    <source src="Avener/3.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
